# 反向代理示例：把 YOUR_DOMAIN 换成实际域名，证书放到 deploy/certs/（fullchain.pem / privkey.pem）
# 无域名时只需保留 80 server 段，用 http://服务器IP 访问。

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # 申请证书时可保留（Let's Encrypt http-01）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # 银行场景建议只保留必要响应头，避免泄露技术栈
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 1024;

    # 审计与对话接口不限速；静态资源加缓存
    location / {
        proxy_pass http://assistant:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    location ~* \.(css|js|svg|png|ico)$ {
        proxy_pass http://assistant:8000;
        expires 7d;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/xiaohui.access.log;
}
